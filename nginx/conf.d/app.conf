include /var/www/*/nginx.conf;

server {
  listen 80;
  server_name mailer.localhost;

  location / {
    resolver 127.0.0.11 valid=10s;
    set $upstream_mailcatcher http://mailer:1080;
    proxy_pass $upstream_mailcatcher;
  }
}

server {
  listen 80;
  server_name uptime.localhost;

  location / {
    resolver 127.0.0.11 valid=10s;
    set $upstream_uptime http://uptime-kuma:3001;
    proxy_pass $upstream_uptime;
  }
}